<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My To-Do List</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f5f5f5; min-height: 100vh; padding: 2rem 1rem; }
.app { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 2rem; box-shadow: 0 2px 16px #0001; }
h1 { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.subtitle { text-align: center; font-size: 14px; color: #888; margin-bottom: 1.5rem; }
.stats { display: flex; gap: 8px; margin-bottom: 1.25rem; }
.stat { flex: 1; padding: 10px; border-radius: 10px; text-align: center; }
.stat-num { font-size: 20px; font-weight: 600; }
.stat-label { font-size: 11px; margin-top: 3px; }
.input-row { display: flex; gap: 8px; margin-bottom: 8px; }
.input-row input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid #ddd; font-size: 15px; outline: none; }
.input-row input:focus { border-color: #7F77DD; box-shadow: 0 0 0 2px #7F77DD22; }
.cat-row { display: flex; gap: 8px; margin-bottom: 1.25rem; }
select { flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; cursor: pointer; background: #fff; }
.add-btn { padding: 10px 18px; background: #7F77DD; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 500; }
.add-btn:hover { background: #534AB7; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid #ddd; background: #f5f5f5; color: #666; }
.tab.active { background: #7F77DD; color: #fff; border-color: #7F77DD; }
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.fbtn { padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #ddd; background: #f5f5f5; color: #666; }
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid #eee; background: #fff; }
.task-card.done { opacity: 0.55; }
.check-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; background: transparent; }
.task-body { flex: 1; }
.task-text { font-size: 15px; color: #222; }
.task-text.done { text-decoration: line-through; color: #aaa; }
.cat-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-top: 4px; font-weight: 500; }
.del-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 18px; padding: 4px; border-radius: 8px; }
.del-btn:hover { color: #E24B4A; background: #FCEBEB; }
.empty { text-align: center; padding: 2rem; color: #bbb; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <h1>📝 My To-Do List</h1>
  <p class="subtitle">Organized by category!</p>
  <div class="stats">
    <div class="stat" style="background:#EEEDFE;color:#3C3489;"><div class="stat-num" id="s-total">0</div><div class="stat-label" style="color:#534AB7;">Total</div></div>
    <div class="stat" style="background:#EAF3DE;color:#27500A;"><div class="stat-num" id="s-done">0</div><div class="stat-label" style="color:#3B6D11;">Done</div></div>
    <div class="stat" style="background:#FAECE7;color:#712B13;"><div class="stat-num" id="s-left">0</div><div class="stat-label" style="color:#993C1D;">Remaining</div></div>
  </div>
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Add a new task..." />
  </div>
  <div class="cat-row">
    <select id="catSelect">
      <option value="Personal">🙂 Personal</option>
      <option value="Work">💼 Work</option>
      <option value="Shopping">🛒 Shopping</option>
      <option value="Health">💪 Health</option>
      <option value="Learning">📚 Learning</option>
    </select>
    <button class="add-btn" onclick="addTask()">+ Add</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setStatus('all',this)">All</button>
    <button class="tab" onclick="setStatus('active',this)">Active</button>
    <button class="tab" onclick="setStatus('done',this)">Completed</button>
  </div>
  <div class="filter-row" id="filterRow"></div>
  <div class="task-list" id="taskList"></div>
</div>
<script>
const CATS = {
  Personal:{ color:'#7F77DD', bg:'#EEEDFE', text:'#3C3489', icon:'🙂' },
  Work:    { color:'#378ADD', bg:'#E6F1FB', text:'#0C447C', icon:'💼' },
  Shopping:{ color:'#1D9E75', bg:'#E1F5EE', text:'#085041', icon:'🛒' },
  Health:  { color:'#D4537E', bg:'#FBEAF0', text:'#72243E', icon:'💪' },
  Learning:{ color:'#BA7517', bg:'#FAEEDA', text:'#633806', icon:'📚' },
};
let tasks=[], statusFilter='all', catFilter='all';
function load(){ try{ const s=localStorage.getItem('todo_cats_v1'); if(s) tasks=JSON.parse(s); }catch(e){} }
function save(){ try{ localStorage.setItem('todo_cats_v1', JSON.stringify(tasks)); }catch(e){} }
function addTask(){
  const inp=document.getElementById('taskInput');
  const text=inp.value.trim(); if(!text) return;
  const cat=document.getElementById('catSelect').value;
  tasks.unshift({id:Date.now(), text, done:false, cat});
  save(); inp.value=''; render();
}
function toggle(id){ const t=tasks.find(t=>t.id===id); if(t){t.done=!t.done; save(); render();} }
function del(id){ tasks=tasks.filter(t=>t.id!==id); save(); render(); }
function setStatus(s,el){ statusFilter=s; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); render(); }
function setCat(c){ catFilter=c; render(); }
function render(){
  const usedCats=[...new Set(tasks.map(t=>t.cat))];
  let fr=`<button class="fbtn" style="${catFilter==='all'?'background:#7F77DD;color:#fff;border-color:#7F77DD;':''}" onclick="setCat('all')">All</button>`;
  usedCats.forEach(c=>{ const cat=CATS[c]; fr+=`<button class="fbtn" style="${catFilter===c?`background:${cat.color};color:#fff;border-color:${cat.color};`:''}" onclick="setCat('${c}')">${cat.icon} ${c}</button>`; });
  document.getElementById('filterRow').innerHTML=fr;
  let f=tasks;
  if(statusFilter==='active') f=f.filter(t=>!t.done);
  if(statusFilter==='done') f=f.filter(t=>t.done);
  if(catFilter!=='all') f=f.filter(t=>t.cat===catFilter);
  const list=document.getElementById('taskList');
  if(!f.length){ list.innerHTML=`<div class="empty">😊 No tasks here!</div>`; }
  else list.innerHTML=f.map(t=>{ const cat=CATS[t.cat]||CATS.Personal; return `
    <div class="task-card ${t.done?'done':''}" style="border-left:3px solid ${cat.color};">
      <button class="check-btn" onclick="toggle(${t.id})" style="border-color:${cat.color};color:${t.done?'#fff':cat.color};background:${t.done?cat.color:'transparent'};">
        ${t.done?'✓':''}
      </button>
      <div class="task-body">
        <div class="task-text ${t.done?'done':''}">${t.text}</div>
        <span class="cat-badge" style="background:${cat.bg};color:${cat.text};">${cat.icon} ${t.cat}</span>
      </div>
      <button class="del-btn" onclick="del(${t.id})">🗑</button>
    </div>`; }).join('');
  const done=tasks.filter(t=>t.done).length;
  document.getElementById('s-total').textContent=tasks.length;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-left').textContent=tasks.length-done;
}
document.getElementById('taskInput').addEventListener('keydown',e=>{ if(e.key==='Enter') addTask(); });
load(); render();
</script>
</body>
</html>
